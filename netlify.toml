[build]
  base    = "portal-mercado"
  publish = "portal-mercado"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from   = "http://esenciaytaza.com/*"
  to     = "https://esenciaytaza.com/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "http://www.esenciaytaza.com/*"
  to     = "https://esenciaytaza.com/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "https://www.esenciaytaza.com/*"
  to     = "https://esenciaytaza.com/:splat"
  status = 301
  force  = true
