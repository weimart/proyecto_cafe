[build]
  base    = "portal-mercado"
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options          = "DENY"
    X-Content-Type-Options   = "nosniff"
    Referrer-Policy          = "strict-origin-when-cross-origin"
    Permissions-Policy       = "geolocation=(), microphone=(), camera=()"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy   = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://production.wompi.co; frame-src 'none'; form-action 'self'; upgrade-insecure-requests"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from   = "http://esenciaytaza.com/*"
  to     = "https://esenciaytaza.com/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "http://www.esenciaytaza.com/*"
  to     = "https://esenciaytaza.com/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "https://www.esenciaytaza.com/*"
  to     = "https://esenciaytaza.com/:splat"
  status = 301
  force  = true
