<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página no encontrada — Esencia y Taza</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Source+Sans+Pro:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *{ margin:0; padding:0; box-sizing:border-box; }
    body{ font-family:'Source Sans Pro',sans-serif; background:#FAF5EE; color:#3D2817;
          min-height:100vh; display:flex; align-items:center; justify-content:center;
          padding:2rem 1rem; text-align:center; }
    .caja{ max-width:440px; }
    img{ height:64px; margin-bottom:1.5rem; }
    h1{ font-family:'Playfair Display',serif; font-size:1.8rem; margin-bottom:.6rem; }
    p{ color:#6B4226; line-height:1.6; margin-bottom:1.6rem; }
    .btns{ display:flex; flex-direction:column; gap:.7rem; }
    a.btn{ display:block; padding:.85rem 1.2rem; border-radius:8px; text-decoration:none; font-weight:700; }
    .btn-tienda{ background:#3D2817; color:#fff; }
    .btn-inicio{ border:1px solid rgba(0,0,0,.15); color:#6B4226; }
  </style>
</head>
<body>
  <div class="caja">
    <img src="/assets/images/isotipo.png" alt="Esencia y Taza">
    <h1>Esta página no existe</h1>
    <p>Puede que el enlace esté mal escrito o que la página haya cambiado de lugar. Nuestro café sigue aquí.</p>
    <div class="btns">
      <a class="btn btn-tienda" href="/#cafes">Ver nuestros cafés</a>
      <a class="btn btn-inicio" href="/">Ir al inicio</a>
    </div>
